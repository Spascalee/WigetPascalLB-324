# Wird automatisch von "pre-commit install" ausgewertet:
# installiert die Hooks fuer commit UND push in einem Schritt.
default_install_hook_types: [pre-commit, pre-push]

repos:
  # Bei jedem commit: Python-Code automatisch mit black formatieren
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.10.1
    hooks:
      - id: black
        stages: [pre-commit]

  # Bei jedem push: alle Tests mit pytest ausfuehren
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: python -m pytest
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
        stages: [pre-push]
